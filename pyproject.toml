[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "focusstack"
version = "0.1.0"
description = "Focus stacking / extended depth-of-field image synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
focusstack = "focusstack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/focusstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
